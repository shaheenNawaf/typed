[build]
  # Keep deployment builds aligned with the verified local Flutter toolchain.
  # Netlify restores the previous build's workspace from cache, so clone only
  # when the cached SDK stamp (bin/cache/flutter.version.json) is missing or
  # does not match the pinned version; otherwise reuse it.
  command = "if grep -qs 3.35.7 flutter_sdk/bin/cache/flutter.version.json; then echo Reusing cached Flutter SDK 3.35.7; else rm -rf flutter_sdk && git clone --depth 1 -b 3.35.7 https://github.com/flutter/flutter.git flutter_sdk; fi && flutter_sdk/bin/flutter config --suppress-analytics && flutter_sdk/bin/flutter build web --release"
  publish = "build/web"

[build.environment]
  FLUTTER_SUPPRESS_ANALYTICS = "true"

# SPA fallback: serve index.html for routes that do not map to a real file so
# client-side routing works on refresh/direct navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Staleness fix: entry documents, the bootstrap, and the service worker must
# revalidate on every load — in-app browsers (Messenger) heuristic-cache
# aggressively and testers saw an old build. The Flutter SW itself handles
# asset caching via its manifest, so assets need no HTTP-cache rules here.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache"
