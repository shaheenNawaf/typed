
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Typed — Markdown notes, organized by #tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:      oklch(99% 0.002 240);
    --surface: oklch(100% 0 0);
    --fg:      oklch(18% 0.012 250);
    --muted:   oklch(54% 0.012 250);
    --border:  oklch(92% 0.005 250);
    --accent:  oklch(52% 0.18 25);
    --accent-dim: oklch(52% 0.18 25 / 0.12);

    --sidebar-bg: oklch(22% 0.012 255);
    --sidebar-fg: oklch(88% 0.005 255);
    --sidebar-muted: oklch(60% 0.01 255);
    --sidebar-active: oklch(30% 0.012 255);
    --sidebar-hover: oklch(28% 0.012 255);

    --list-bg: oklch(96% 0.003 250);
    --tag-bg: oklch(52% 0.18 25 / 0.10);
    --tag-fg: oklch(42% 0.15 25);

    --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;

    --sidebar-w: 232px;
    --sidebar-icons-w: 48px;
    --notelist-w: 340px;
    --toolbar-h: 48px;
    --title-h: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font: 15px/1.55 var(--font-body);
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) var(--notelist-w) 1fr;
    width: 100%; height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    background: var(--sidebar-bg);
    color: var(--sidebar-fg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .sidebar-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px 12px;
    border-bottom: 1px solid oklch(100% 0 0 / 0.08);
    position: relative;
  }
  .sidebar-logo {
    font: 600 16px var(--font-display);
    letter-spacing: -0.01em;
    color: var(--sidebar-fg);
  }
  .sidebar-logo span { color: var(--accent); }
  .sidebar-collapse-btn {
    margin-left: auto;
    background: none;
    border: none;
    width: 28px; height: 28px;
    border-radius: 5px;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--sidebar-muted);
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
  }
  .sidebar-collapse-btn:hover { background: var(--sidebar-hover); color: var(--sidebar-fg); }
  .sidebar-collapse-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 5px; }
  .sidebar-collapse-btn svg { width: 16px; height: 16px; }
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: oklch(100% 0 0 / 0.12) transparent;
  }
  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: oklch(100% 0 0 / 0.12); border-radius: 4px; }

  .nav-section { padding: 0 12px; margin-bottom: 6px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--sidebar-fg);
    cursor: pointer;
    transition: background 0.12s;
    letter-spacing: 0.01em;
  }
  .nav-item:hover { background: var(--sidebar-hover); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
  .nav-item.active { background: var(--sidebar-active); color: #fff; }
  .nav-item .ico {
    width: 18px; height: 18px;
    display: grid; place-items: center;
    font-size: 15px; opacity: 0.55;
  }
  .nav-item.active .ico { opacity: 1; }
  .nav-item .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--sidebar-muted);
    font-variant-numeric: tabular-nums;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }
  .nav-item.active .count { color: oklch(100% 0 0 / 0.55); }

  .nav-divider {
    margin: 6px 12px;
    border: 0;
    height: 1px;
    background: oklch(100% 0 0 / 0.06);
  }

  .tag-group { margin-bottom: 2px; }
  .tag-parent {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--sidebar-fg);
    cursor: pointer;
    transition: background 0.12s;
    letter-spacing: 0.01em;
  }
  .tag-parent:hover { background: var(--sidebar-hover); }
  .tag-parent:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
  .tag-parent .chevron {
    width: 16px; height: 16px;
    display: grid; place-items: center;
    font-size: 10px;
    transition: transform 0.18s;
    opacity: 0.45;
    flex-shrink: 0;
  }
  .tag-parent.open .chevron { transform: rotate(90deg); }
  .tag-parent .tag-icon {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .tag-children {
    overflow: hidden;
    transition: max-height 0.25s ease;
    max-height: 0;
  }
  .tag-children.open { max-height: 400px; }
  .tag-child {
    display: block;
    width: 100%;
    padding: 4px 12px 4px 44px;
    font: 12.5px/1.5 var(--font-body);
    color: var(--sidebar-muted);
    cursor: pointer;
    border-radius: 4px;
    transition: color 0.12s, background 0.12s;
    letter-spacing: 0.01em;
    background: none;
    border: none;
    text-align: left;
  }
  .tag-child:hover { color: var(--sidebar-fg); background: var(--sidebar-hover); }
  .tag-child:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .tag-child.active { color: var(--accent); }
  .tag-leaf {
    display: block;
    padding: 4px 12px 4px 36px;
    background: none; border: none;
    width: 100%; text-align: left;
    font-size: 12.5px;
    color: var(--sidebar-muted);
    cursor: pointer;
    border-radius: 4px;
    transition: color 0.12s;
    letter-spacing: 0.01em;
    font-family: inherit;
    line-height: 1.5;
  }
  .tag-leaf:hover { color: var(--sidebar-fg); background: var(--sidebar-hover); }
  .tag-leaf:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .tag-leaf.active { color: var(--accent); }
  .tag-parent-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    width: 100%;
    border: none;
    background: transparent;
    border-radius: 6px;
    font: 13px/1.5 var(--font-body);
    color: var(--sidebar-fg);
    cursor: pointer;
    transition: background 0.12s;
    letter-spacing: 0.01em;
    text-align: left;
  }
  .tag-parent-btn:hover { background: var(--sidebar-hover); }
  .tag-parent-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }

  .notelist {
    background: var(--list-bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .notelist-search {
    padding: 14px 16px 10px;
    flex-shrink: 0;
  }
  .notelist-search input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: 13.5px var(--font-body);
    background: var(--surface);
    color: var(--fg);
    outline: none;
    transition: border-color 0.15s;
  }
  .notelist-search input:focus { border-color: var(--accent); }
  .notelist-search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .notelist-search input::placeholder { color: var(--muted); }
  .notelist-header {
    padding: 0 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .notelist-header h2 {
    font: 500 13px var(--font-body);
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .notelist-header button {
    background: none; border: none;
    font: 13px var(--font-body);
    color: var(--muted); cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.12s;
  }
  .notelist-header button:hover { background: var(--border); }
  .notelist-header button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .notelist-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .notelist-scroll::-webkit-scrollbar { width: 4px; }
  .notelist-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .no-results {
    padding: 32px 16px;
    text-align: center;
    font: 13px var(--font-body);
    color: var(--muted);
  }

  .note-card {
    padding: 14px 16px;
    margin-bottom: 4px;
    background: var(--surface);
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: border-color 0.12s, box-shadow 0.15s;
  }
  .note-card:hover { border-color: var(--border); }
  .note-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  .note-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .note-card .card-title {
    font: 600 14.5px var(--font-display);
    color: var(--fg);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-card .card-preview {
    display: flex;
    align-items: center;
    gap: 6px;
    font: 12px var(--font-body);
    color: var(--muted);
    margin-bottom: 6px;
  }
  .note-card .card-preview .preview-icon {
    width: 18px; height: 18px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .note-card .card-preview .preview-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .note-card .card-preview .preview-filetype {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--border);
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .note-card .card-preview .tag-chip {
    display: inline;
    background: var(--tag-bg);
    color: var(--tag-fg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 500;
  }
  .note-card .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font: 11.5px var(--font-mono);
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .note-card .card-meta .att-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--border);
    font-size: 10.5px;
    color: var(--muted);
  }

  .editor {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .editor-titlebar {
    padding: 14px 24px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .editor-titlebar input {
    width: 100%;
    border: none;
    font: 600 22px/1.3 var(--font-display);
    letter-spacing: -0.015em;
    color: var(--fg);
    outline: none;
    background: transparent;
  }
  .editor-titlebar input::placeholder { color: var(--muted); }
  .editor-titlebar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .editor-tags {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 24px 8px;
    flex-wrap: wrap;
    min-height: 20px;
  }
  .editor-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 8px;
    border-radius: 12px;
    background: var(--tag-bg);
    color: var(--tag-fg);
    font-size: 12px;
    font-weight: 500;
    cursor: default;
  }
  .editor-tag .remove {
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.12s;
  }
  .editor-tag .remove:hover { opacity: 1; }

  .editor-body-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .editor-body-wrap::-webkit-scrollbar { width: 4px; }
  .editor-body-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .editor-textarea {
    width: 100%;
    min-height: 100%;
    border: none;
    resize: none;
    outline: none;
    font: 15px/1.7 var(--font-body);
    color: var(--fg);
    background: transparent;
    font-variant-ligatures: common-ligatures;
  }
  .editor-textarea::placeholder { color: var(--muted); }

  .editor-preview {
    font: 15px/1.7 var(--font-body);
    color: var(--fg);
    font-variant-ligatures: common-ligatures;
  }
  .editor-preview h1 { font: 700 24px/1.3 var(--font-display); letter-spacing: -0.02em; margin: 24px 0 8px; color: var(--fg); }
  .editor-preview h2 { font: 600 20px/1.3 var(--font-display); letter-spacing: -0.015em; margin: 20px 0 6px; color: var(--fg); }
  .editor-preview h3 { font: 600 17px/1.3 var(--font-display); letter-spacing: -0.01em; margin: 16px 0 4px; color: var(--fg); }
  .editor-preview p { margin: 0 0 10px; }
  .editor-preview ul, .editor-preview ol { padding-left: 24px; margin-bottom: 10px; }
  .editor-preview li { margin-bottom: 4px; }
  .editor-preview li.task-item { list-style: none; margin-left: -24px; }
  .editor-preview li.task-item::before { content: '☐ '; color: var(--muted); }
  .editor-preview li.task-item.done::before { content: '☑ '; color: var(--accent); }
  .editor-preview code {
    background: var(--list-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font: 13px var(--font-mono);
    font-size: 0.9em;
  }
  .editor-preview pre {
    background: var(--sidebar-bg);
    color: var(--sidebar-fg);
    padding: 14px 18px;
    border-radius: 8px;
    overflow-x: auto;
    margin-bottom: 12px;
    font: 13px var(--font-mono);
    line-height: 1.55;
  }
  .editor-preview pre code { background: transparent; padding: 0; color: inherit; }
  .editor-preview blockquote {
    border-left: 3px solid var(--accent);
    padding: 2px 16px;
    margin: 10px 0;
    color: var(--muted);
  }
  .editor-preview a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .editor-preview a:hover { color: oklch(45% 0.16 25); }
  .editor-preview strong { font-weight: 600; }
  .editor-preview .tag-chip {
    display: inline;
    background: var(--tag-bg);
    color: var(--tag-fg);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.85em;
    font-weight: 500;
    white-space: nowrap;
  }
  .editor-preview table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .editor-preview th, .editor-preview td {
    border: 1px solid var(--border);
    padding: 6px 12px;
    text-align: left;
  }
  .editor-preview th { background: var(--list-bg); font-weight: 600; font-size: 13px; }
  .editor-preview hr {
    border: 0;
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  .editor-toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .tb-btn {
    width: 34px; height: 34px;
    border: none;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--muted);
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
  }
  .tb-btn:hover { background: var(--list-bg); color: var(--fg); }
  .tb-btn:active { background: var(--border); }
  .tb-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; color: var(--fg); }
  .tb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .tb-sep {
    width: 1px; height: 20px;
    background: var(--border);
    margin: 0 4px;
    flex-shrink: 0;
  }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .tb-toggle {
    font: 12px var(--font-body);
    padding: 4px 10px;
    border-radius: 6px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--muted);
    letter-spacing: 0.02em;
    transition: background 0.12s, color 0.12s;
  }
  .tb-toggle:hover { background: var(--list-bg); color: var(--fg); }
  .tb-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .tb-toggle.on { background: var(--accent-dim); color: var(--accent); }
  .tb-wordcount {
    font: 11px var(--font-mono);
    color: var(--muted);
    padding: 0 8px;
    letter-spacing: 0.04em;
  }

  .editor-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 8px;
  }
  .editor-empty .empty-icon {
    width: 48px; height: 48px;
    opacity: 0.25;
    margin-bottom: 8px;
  }
  .editor-empty p { font-size: 14px; }
  .editor-empty .kbd {
    font: 11px var(--font-mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .mobile-back {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .mobile-back svg { width: 16px; height: 16px; }
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: oklch(0% 0 0 / 0.35);
    z-index: 50;
  }
  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 0 env(safe-area-inset-bottom, 8px);
    z-index: 100;
    justify-content: space-around;
  }
  .mobile-nav button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    font: 10px var(--font-body);
    color: var(--muted);
    cursor: pointer;
    padding: 4px 12px;
    letter-spacing: 0.03em;
  }
  .mobile-nav button.active { color: var(--accent); }
  .mobile-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .mobile-nav button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  @media (max-width: 1023px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: 280px; z-index: 60;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.show { display: block; }
    .notelist {
      border-right: none;
      padding-bottom: 56px;
    }
    .editor {
      position: fixed; inset: 0; z-index: 40;
      display: none;
    }
    .editor.show { display: flex; }
    .editor-body-wrap { padding-bottom: 64px; }
    .editor-toolbar { padding-bottom: 64px; }
    .mobile-back { display: flex; }
    .mobile-nav { display: flex; }
    body.has-editor-open .mobile-nav { display: none; }
    body.has-editor-open .notelist { display: none; }
    .editor-titlebar { padding-top: 12px; }
    .editor-titlebar input { font-size: 20px; }
  }
  @media (min-width: 1024px) {
    .mobile-back, .mobile-nav, .sidebar-overlay { display: none !important; }
  }

  .hidden { display: none !important; }

  /* Sidebar collapse — icons-only */
  .app.sb-icons { grid-template-columns: var(--sidebar-icons-w) var(--notelist-w) 1fr; }
  .sidebar.collapsed-icons .sidebar-logo,
  .sidebar.collapsed-icons .nav-item span:not(.ico),
  .sidebar.collapsed-icons .nav-item .count,
  .sidebar.collapsed-icons .nav-divider,
  .sidebar.collapsed-icons .nav-section:last-child,
  .sidebar.collapsed-icons .sidebar-nav > div:last-child { display: none; }
  .sidebar.collapsed-icons .sidebar-header { padding: 16px 10px 12px; }

  /* Sidebar hover expand for icons mode */

  .sb-hover .sidebar.collapsed-icons .sidebar-logo { display: block; }

  .sb-hover .sidebar.collapsed-icons .sidebar-header { padding: 16px 18px 12px; }
  .sb-hover .sidebar.collapsed-icons .sidebar-nav > div:last-child { display: flex; }
</style>
</head>
<body>

<script>
let notes = [
  { id:'n1', title:'Rust ownership primer', content:'# Rust Ownership\n\nThree rules govern ownership in Rust:\n\n1. Each value has exactly one **owner**.\n2. When the owner goes out of scope, the value is dropped.\n3. Ownership can be transferred via *moves*.\n\n## Borrowing\n\nYou can borrow a reference with `&`:\n\n```rust\nlet s = String::from("hello");\nlet r = &s; // immutable borrow\n```\n\n> "Shared XOR mutable" — you can have many readers or one writer, never both.\n\nSee also #code/rust and #code/algo.', tags:['code/rust','code/algo'], time:'2 hours ago', att:null },
  { id:'n2', title:'Binary search cheatsheet', content:'# Binary Search\n\nUse when the search space is **sorted** and you can discard half each step.\n\n## Template\n\n```python\ndef binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n```\n\n- [ ] Practice LC #704\n- [ ] Practice LC #33 (rotated)\n- [ ] Practice LC #153 (min in rotated)\n\nTime: O(log n) | Space: O(1)\n\n#code/algo #study/cs', tags:['code/algo','study/cs'], time:'Yesterday', att:null },
  { id:'n3', title:'Weekend sourdough recipe', content:'# Sourdough Bread\n\n## Levain (night before)\n- 35g starter\n- 35g bread flour\n- 35g whole wheat\n- 70g water\n\n## Dough\n- 700g bread flour\n- 200g whole wheat\n- 680g water (78% hydration)\n- 180g levain\n- 20g salt\n\n### Schedule\n| Step | Time |\n| --- | --- |\n| Autolyse | 0:00 |\n| Add levain + salt | 0:30 |\n| Fold #1 | 1:00 |\n| Fold #2 | 1:30 |\n| Fold #3 | 2:00 |\n| Bulk done | ~4:30 |\n| Cold proof | overnight |\n\n#recipe #personal/family', tags:['recipe','personal/family'], time:'July 15', att:'PDF' },
  { id:'n4', title:'Design system tokens', content:'# Design Tokens\n\nStart with the **purpose layer**, not the value layer.\n\n```css\n:root {\n  --bg: oklch(99% 0.002 240);\n  --fg: oklch(18% 0.012 250);\n  --accent: oklch(52% 0.18 25);\n}\n```\n\n## Why OKLCH?\n- Perceptually uniform\n- No purple-shift when adjusting lightness\n- Wide gamut support\n\nUse `oklch()` for every new project. HSL and RGB have served their time.\n\n#study/design #code', tags:['study/design','code'], time:'July 10', att:null },
  { id:'n5', title:'Async Python patterns', content:'# Async Python\n\n## The event loop\n\n`asyncio.run()` starts the loop. Everything async runs inside it.\n\n```python\nimport asyncio\n\nasync def fetch(url):\n    # Simulate network call\n    await asyncio.sleep(1)\n    return f"Data from {url}"\n\nasync def main():\n    tasks = [fetch(f"api/{i}") for i in range(5)]\n    results = await asyncio.gather(*tasks)\n    print(results)\n\nasyncio.run(main())\n```\n\n## Key rules\n- `await` only inside `async def`\n- Don\'t mix sync blocking calls in async context — use `run_in_executor`\n- `asyncio.gather()` for concurrency, `asyncio.create_task()` for fire-and-forget\n\n#code/python #code', tags:['code/python','code'], time:'July 8', att:null },
  { id:'n6', title:'Trip to Kyoto — itinerary', content:'# Kyoto Trip\n\n## Day 1 — Arrival\n- Land at KIX, Haruka express to Kyoto Station\n- Check in near Higashiyama\n- Evening walk through Gion\n\n## Day 2 — East\n- Fushimi Inari (go early, 6:30am)\n- Tofuku-ji\n- Kiyomizu-dera at sunset\n\n## Day 3 — North\n- Kinkaku-ji (Golden Pavilion)\n- Ryoan-ji rock garden\n- Arashiyama bamboo grove\n\n> Pack comfortable shoes. Temple hopping is 20k+ steps/day.\n\n#travel #personal', tags:['travel','personal'], time:'July 3', att:null },
  { id:'n7', title:'GraphQL vs REST notes', content:'# GraphQL vs REST\n\n## When GraphQL wins\n- Complex, nested data requirements\n- Multiple clients with different shape needs\n- Rapid iteration on frontend\n\n## When REST wins\n- Simple CRUD\n- Caching is critical (CDN edge caching)\n- File uploads\n\n## The middle ground\nMost apps don\'t need GraphQL. A well-designed REST API with sparse fieldsets and includes gets you 80% there.\n\n#code #study/cs #blog', tags:['code','study/cs','blog'], time:'June 28', att:null },
  { id:'n8', title:'Linear algebra for ML', content:'# Linear Algebra for ML\n\n## Matrix multiplication\n\n`C = A @ B` where A is `m x n` and B is `n x p`. Result C is `m x p`.\n\nEach element `c[i][j]` is the dot product of row `i` of A and column `j` of B.\n\n## Eigendecomposition\n\n`A v = λ v`\n\n- `v` is an eigenvector, `λ` is the eigenvalue\n- Used in PCA, spectral clustering, PageRank\n\n## SVD\n\n`A = U Σ V^T`\n\n- U: left singular vectors (A A^T eigenvectors)\n- Σ: singular values (sqrt of eigenvalues)\n- V^T: right singular vectors (A^T A eigenvectors)\n\n#study/math #study/cs', tags:['study/math','study/cs'], time:'June 20', att:null }
];

let currentNoteId = null;
let sortDesc = true;
let activeFilter = 'notes';
let previewMode = false;
let sidebarState = 'expanded'; // expanded | icons | hidden

(function() {
  const sidebar = document.getElementById('sidebar');
  const app = document.querySelector('.app');
  let hoverTimer = null;
  sidebar.addEventListener('mouseenter', function() {
    if (sidebarState !== 'icons' || window.innerWidth < 1024) return;
    clearTimeout(hoverTimer);
    app.classList.add('sb-hover');
  });
  sidebar.addEventListener('mouseleave', function() {
    if (sidebarState !== 'icons' || window.innerWidth < 1024) return;
    hoverTimer = setTimeout(function() { app.classList.remove('sb-hover'); }, 150);
  });
  sidebar.addEventListener('click', function(e) {
    if (sidebarState === 'icons' && window.innerWidth >= 1024 && !e.target.closest('button') && !e.target.closest('.nav-item')) {
      app.classList.remove('sb-hover'); // dismiss flyout on click outside interactive elements
    }
  });
})();

function toggleSidebarCollapse() {
  const sidebar = document.getElementById('sidebar');
  const app = document.querySelector('.app');
  const icon = document.getElementById('collapseIcon');

  sidebar.classList.remove('collapsed-icons', 'collapsed-hidden');
  app.classList.remove('sb-icons', 'sb-hidden');

  if (sidebarState === 'expanded') {
    sidebarState = 'icons';
    sidebar.classList.add('collapsed-icons');
    app.classList.add('sb-icons');
    icon.innerHTML = '<polyline points="9 18 15 12 9 6"/>';
  } else if (sidebarState === 'icons') {
    sidebarState = 'hidden';
    app.classList.add('sb-hidden');
    icon.innerHTML = '<polyline points="9 18 15 12 9 6"/><line x1="4" y1="4" x2="20" y2="20"/>';
    if (window.innerWidth < 1024) closeSidebar();
  } else {
    sidebarState = 'expanded';
    icon.innerHTML = '<polyline points="15 18 9 12 15 6"/>';
    if (window.innerWidth < 1024 && !sidebar.classList.contains('open')) {
      openSidebar();
    }
  }
}

function renderNoteList() {
  const container = document.getElementById('noteCards');
  const noResults = document.getElementById('noResults');
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  let filtered = notes;

  if (activeFilter === 'untagged') filtered = notes.filter(n => n.tags.length === 0);
  else if (activeFilter === 'todo') filtered = notes.filter(n => n.title.toLowerCase().includes('todo') || n.content.includes('[ ]'));
  else if (activeFilter === 'today') filtered = [notes[0]];
  else if (activeFilter === 'locked') filtered = [];
  else if (activeFilter === 'archive') filtered = [];
  else if (activeFilter === 'trash') filtered = [];
  else if (activeFilter === 'notes') { }

  if (search) {
    filtered = filtered.filter(n =>
      n.title.toLowerCase().includes(search) ||
      n.content.toLowerCase().includes(search) ||
      n.tags.some(t => t.toLowerCase().includes(search))
    );
  }

  filtered.sort((a, b) => {
    const cmp = a.title.localeCompare(b.title);
    return sortDesc ? -cmp : cmp;
  });

  if (filtered.length === 0 && !noResults.classList.contains('hidden')) {
    noResults.classList.remove('hidden');
  } else {
    noResults.classList.add('hidden');
  }

  container.innerHTML = filtered.map(n => {
    const tagsHtml = n.tags.slice(0, 3).map(t => `<span class="tag-chip">#${h(t)}</span>`).join(' ');
    const sel = n.id === currentNoteId ? ' selected' : '';
    const fileIcon = n.att ? `<span class="preview-filetype"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${n.att}</span>` : '';
    return `<div class="note-card${sel}" data-id="${n.id}" onclick="selectNote('${n.id}')" tabindex="0" role="button" aria-label="${h(n.title)}">
      <div class="card-title">${h(n.title)}</div>
      <div class="card-preview">
        ${fileIcon || '<span class="preview-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg></span>'}
        ${tagsHtml}
      </div>
      <div class="card-meta">${n.time}</div>
    </div>`;
  }).join('');

  noResults.style.display = filtered.length === 0 ? '' : 'none';
}

function h(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function filterNotes() { renderNoteList(); }

function sortNotes() {
  sortDesc = !sortDesc;
  document.getElementById('sortBtn').textContent = sortDesc ? 'Recent ↓' : 'A–Z ↑';
  renderNoteList();
}

function selectNote(id) {
  currentNoteId = id;
  const note = notes.find(n => n.id === id);
  if (!note) return;

  document.getElementById('editorTitle').value = note.title;
  document.getElementById('editorTextarea').value = note.content;
  document.getElementById('editorEmpty').classList.add('hidden');
  document.getElementById('editorBodyWrap').style.display = '';

  const tagCtr = document.getElementById('editorTags');
  tagCtr.innerHTML = note.tags.map(t =>
    `<span class="editor-tag">#${h(t)}</span>`
  ).join('');

  document.getElementById('editorToolbar').style.display = '';

  updateWordCount();
  renderPreview();
  renderNoteList();

  if (window.innerWidth < 1024) openEditorMobile();
}

function openEditorMobile() {
  document.getElementById('editor').classList.add('show');
  document.body.classList.add('has-editor-open');
}

function closeEditor() {
  document.getElementById('editor').classList.remove('show');
  document.body.classList.remove('has-editor-open');
}

function syncTitle() {
  if (!currentNoteId) {
    createNote(document.getElementById('editorTitle').value.trim() || undefined);
    return;
  }
  const note = notes.find(n => n.id === currentNoteId);
  if (note) {
    note.title = document.getElementById('editorTitle').value;
    note.content = document.getElementById('editorTextarea').value;
    updateWordCount();
    renderNoteList();
  }
}

function renderPreview() {
  if (!currentNoteId) return;
  const textarea = document.getElementById('editorTextarea');
  const preview = document.getElementById('editorPreview');
  let md = textarea.value;

  let html = md
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="#">$1</a>')
    .replace(/!\[(.+?)\]\((.+?)\)/g, '<span style="background:var(--list-bg);padding:4px 10px;border-radius:6px;display:inline-block;font-style:italic;color:var(--muted)">image: $2</span>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/^- \[x\] (.+)$/gm, '<li class="task-item done">$1</li>')
    .replace(/^- \[ \] (.+)$/gm, '<li class="task-item">$1</li>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/\|(.+)\|\n\|[-\s|]+\|\n((?:\|.+\|\n?)*)/gm, function(m, header, rows) {
      const hcells = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
      const rcells = rows.trim().split('\n').map(r =>
        '<tr>' + r.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('') + '</tr>'
      ).join('');
      return `<table><thead><tr>${hcells}</tr></thead><tbody>${rcells}</tbody></table>`;
    })
    .replace(/^---$/gm, '<hr>')
    .replace(/#([a-zA-Z][\w/]*)/g, '<span class="tag-chip">#$1</span>')
    .replace(/\n\n+/g, '</p><p>')
    .replace(/\n/g, '<br>');

  html = '<p>' + html + '</p>';
  html = html.replace(/<p><li>/g, '<ul><li>')
    .replace(/<\/li><br><li>/g, '</li><li>')
    .replace(/<\/li><\/p>/g, '</li></ul>')
    .replace(/<\/li><br>/g, '</li>');
  html = html.replace(/<p><table>/g, '<table>').replace(/<\/table><\/p>/g, '</table>');
  html = html.replace(/<p><blockquote>/g, '<blockquote>').replace(/<\/blockquote><\/p>/g, '</blockquote>');
  html = html.replace(/<p><pre>/g, '<pre>').replace(/<\/pre><\/p>/g, '</pre>');
  html = html.replace(/<p><h([1-3])>/g, '<h$1>').replace(/<\/h[1-3]><\/p>/g, '</h$1>');
  html = html.replace(/<p><hr><\/p>/g, '<hr>');

  preview.innerHTML = html;
  updateWordCount();
}

function updateWordCount() {
  const text = document.getElementById('editorTextarea').value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = words + ' w';
}

function togglePreview() {
  previewMode = !previewMode;
  const textarea = document.getElementById('editorTextarea');
  const preview = document.getElementById('editorPreview');
  const btn = document.getElementById('previewToggle');

  if (previewMode) {
    textarea.classList.add('hidden');
    preview.classList.remove('hidden');
    btn.textContent = 'Edit';
    btn.classList.add('on');
    btn.setAttribute('aria-pressed', 'true');
  } else {
    textarea.classList.remove('hidden');
    preview.classList.add('hidden');
    btn.textContent = 'Preview';
    btn.classList.remove('on');
    btn.setAttribute('aria-pressed', 'false');
  }
}

function insertMD(before, after) {
  const ta = document.getElementById('editorTextarea');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  ta.value = ta.value.substring(0, start) + before + sel + after + ta.value.substring(end);
  ta.focus();
  ta.selectionStart = start + before.length;
  ta.selectionEnd = end + before.length;
  syncTitle();
  renderPreview();
}

function insertLine(prefix) {
  const ta = document.getElementById('editorTextarea');
  const start = ta.selectionStart;
  const lineStart = ta.value.lastIndexOf('\n', start - 1) + 1;
  ta.value = ta.value.substring(0, lineStart) + prefix + ta.value.substring(lineStart);
  ta.focus();
  ta.selectionStart = lineStart + prefix.length;
  ta.selectionEnd = lineStart + prefix.length;
  syncTitle();
  renderPreview();
}

function toggleSidebar() { closeSidebar(); }

function toggleTagGroup(btn) {
  const open = btn.classList.contains('open');
  const children = btn.nextElementSibling;
  if (open) {
    btn.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    children.classList.remove('open');
  } else {
    btn.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    children.classList.add('open');
  }
}

function openSidebar() {
  const app = document.querySelector('.app');
  const sidebar = document.getElementById('sidebar');
  if (sidebarState === 'hidden') {
    toggleSidebarCollapse(); // restore from hidden → expanded
  }
  sidebar.classList.add('open');
  document.getElementById('sb-overlay').classList.add('show');
}
function closeSidebarOrCollapse() {
  if (window.innerWidth < 1024) {
    closeSidebar();
  } else if (sidebarState === 'expanded') {
    toggleSidebarCollapse(); // → icons
  }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('show');
}
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('show');
}

document.querySelectorAll('.nav-item[data-view]').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.nav-item[data-view]').forEach(i => i.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.view;
    currentNoteId = null;
    document.getElementById('editorEmpty').classList.remove('hidden');
    document.getElementById('editorToolbar').style.display = 'none';
    document.getElementById('editorBodyWrap').style.display = 'none';
    document.getElementById('editorTitle').value = '';
    document.getElementById('editorTextarea').value = '';
    document.getElementById('editorTags').innerHTML = '';
    document.getElementById('wordCount').textContent = '0 w';
    document.getElementById('listTitle').textContent = this.textContent.trim().split(/\s+/)[0];
    if (window.innerWidth < 1024) closeSidebar();
    renderNoteList();
  });
});

document.querySelectorAll('.tag-child[data-filter]').forEach(el => {
  el.addEventListener('click', function() {
    activeFilter = 'notes';
    document.querySelectorAll('.nav-item[data-view]').forEach(i => i.classList.remove('active'));
    document.querySelector('.nav-item[data-view="notes"]').classList.add('active');
    document.getElementById('searchInput').value = this.dataset.filter;
    document.getElementById('listTitle').textContent = '#' + this.dataset.filter;
    document.querySelectorAll('.tag-child').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    filterNotes();
    if (window.innerWidth < 1024) closeSidebar();
  });
});

function showNotesList() {
  closeEditor();
  document.getElementById('mNavNotes').classList.add('active');
}

function createNote(title) {
  if (!title) title = 'Untitled';
  const id = 'n' + Date.now();
  const note = { id, title, content:'', tags:[], time:'Just now', att:null };
  notes.unshift(note);
  currentNoteId = id;
  activeFilter = 'notes';
  document.querySelectorAll('.nav-item[data-view]').forEach(i => i.classList.remove('active'));
  document.querySelector('.nav-item[data-view="notes"]').classList.add('active');
  document.getElementById('listTitle').textContent = 'All Notes';
  document.getElementById('editorTitle').value = title;
  document.getElementById('editorTextarea').value = '';
  document.getElementById('editorTags').innerHTML = '';
  document.getElementById('editorEmpty').classList.add('hidden');
  document.getElementById('editorBodyWrap').style.display = '';
  document.getElementById('editorToolbar').style.display = '';
  document.getElementById('wordCount').textContent = '0 w';
  renderNoteList();
  if (window.innerWidth < 1024) openEditorMobile();
  document.getElementById('editorTitle').focus();
  document.getElementById('editorTitle').select();
}

document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
    e.preventDefault();
    createNote();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
    e.preventDefault();
    insertMD('**', '**');
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'i') {
    e.preventDefault();
    insertMD('*', '*');
  }
  if (e.key === 'Escape') {
    if (document.getElementById('sidebar').classList.contains('open')) {
      closeSidebar();
    }
  }
});

document.getElementById('noteCards').addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const cards = [...this.querySelectorAll('.note-card')];
    const idx = cards.indexOf(document.activeElement);
    const next = e.key === 'ArrowDown' ? idx + 1 : idx - 1;
    if (next >= 0 && next < cards.length) cards[next].focus();
  }
  if (e.key === 'Enter') {
    const card = document.activeElement;
    if (card && card.dataset.id) selectNote(card.dataset.id);
  }
});

renderNoteList();
</script>
