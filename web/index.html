<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Typed — Notes, Tasks &amp; Money in One Quiet Workspace</title>
  <meta name="description" content="Typed — a quiet, local-first workspace for notes, tasks, and money.">
  <link rel="canonical" href="https://typed.shaheen.works/">

  <!-- Viewport meta tag for responsive web layout -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#CC4D3C">

  <!-- Open Graph (social share card) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Typed">
  <meta property="og:title" content="Typed — Notes, Tasks &amp; Money in One Quiet Workspace">
  <meta property="og:description" content="A quiet, local-first workspace for notes, tasks, and money. Private by design: everything stays on your device.">
  <meta property="og:url" content="https://typed.shaheen.works/">
  <meta property="og:image" content="https://typed.shaheen.works/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Typed — the t. monogram and wordmark on a cream tile">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Typed — Notes, Tasks &amp; Money in One Quiet Workspace">
  <meta name="twitter:description" content="A quiet, local-first workspace for notes, tasks, and money. Private by design: everything stays on your device.">
  <meta name="twitter:image" content="https://typed.shaheen.works/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Typed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <!-- Structured data for search + AI assistants (GEO) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Typed",
    "url": "https://typed.shaheen.works/",
    "description": "A quiet, local-first workspace for notes, tasks, and money.",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Web, Windows, macOS, Linux, Android",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <style>
    /* Keep the page from scrolling or showing a white flash behind the
       canvas. NOTE: do not position:fixed the flutter-view here — Flutter
       web measures its view from the element's layout box, and fixed
       positioning inside embedded iframes breaks that measurement. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #15171A; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
