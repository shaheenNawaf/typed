<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  #icon { width: 1024px; height: 1024px; overflow: hidden; }
  #icon img { width: 1024px; height: 1024px; display: block; }
  #og {
    width: 1200px; height: 630px; background: #F8F9FA;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; margin-top: 40px;
  }
  #og .mark { width: 128px; height: 128px; display: block; }
  #og .wordmark { width: 280px; height: auto; display: block; }
  #og .tagline {
    font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 30px;
    color: #6E7A85; letter-spacing: -0.01em;
  }
  #og .url {
    font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 20px;
    color: #1A242E;
  }
</style>
</head>
<body>
  <div id="icon"><img src="../logo-tile-cream.svg" alt=""></div>
  <div id="og">
    <img class="mark" src="../monogram.svg" alt="">
    <img class="wordmark" src="../wordmark.svg" alt="">
    <div class="tagline">A quiet, local-first workspace for notes, tasks, and money.</div>
    <div class="url">typed.shaheen.works</div>
  </div>
</body>
</html>
