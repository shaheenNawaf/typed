name: typed
description: "A local-first workspace for notes, tasks, and money."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  google_mlkit_text_recognition: ^0.13.0
  markdown: ^7.3.1
  share_plus: ^10.0.0
  cross_file: ^0.3.4+2
  file_picker: ^8.0.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Explicit single file: the other branding SVGs are design sources and
    # live in design/, not shipped in the bundle.
    - assets/branding/typed-mark.svg
